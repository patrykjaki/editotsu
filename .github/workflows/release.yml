# Editotsu release pipeline.
#
# The version comes from editotsu.version in gradle.properties; versionCode follows
# the same formula as app/build.gradle.kts. Nothing here names a version.
#
# Two modes, one deterministic pipeline:
#   RC validation : manual workflow_dispatch with rc_sha -> evidence only, NO release.
#   Tag mode      : push of tag v<editotsu.version> -> reverify approved SHA
#                   (repo variable APPROVED_RELEASE_SHA) -> GitHub release.
#                   Versions with "-" (alpha/beta/rc) ship as ani.editotsu.beta
#                   pre-releases; stable versions as ani.editotsu.
#
# Provenance rule: every publishable APK has exactly one producing build
# execution (per-flavor matrix legs build and upload only their flavor).
# Release creation is the final job and depends on every required job.
# A partial matrix can never publish: asset globs use fail_on_unmatched_files.
name: Editotsu release

on:
  workflow_dispatch:
    inputs:
      rc_sha:
        description: "Exact proposed RC commit SHA (40 hex). Evidence only; no release."
        required: true
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CI: "true"

jobs:
  sha-gate:
    runs-on: ubuntu-latest
    outputs:
      checked_sha: ${{ steps.resolve.outputs.checked_sha }}
      trigger_mode: ${{ steps.resolve.outputs.trigger_mode }}
      version: ${{ steps.version.outputs.version }}
      code: ${{ steps.version.outputs.code }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      build_type: ${{ steps.version.outputs.build_type }}
      package: ${{ steps.version.outputs.package }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - name: Validate candidate SHA input
        id: resolve
        # inputs and variables go through env, never into the script text
        env:
          EVENT_NAME: ${{ github.event_name }}
          RC_SHA: ${{ inputs.rc_sha }}
          APPROVED_SHA: ${{ vars.APPROVED_RELEASE_SHA }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SHA="$RC_SHA"
            MODE="rc-validation"
          else
            VARD="$APPROVED_SHA"
            if ! printf '%s' "$VARD" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::APPROVED_RELEASE_SHA missing or not 40-hex"
              exit 1
            fi
            SHA="$VARD"
            MODE="tag"
          fi

          if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::candidate SHA is not 40-hex"
            exit 1
          fi

          echo "checked_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "trigger_mode=$MODE" >> "$GITHUB_OUTPUT"
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.checked_sha }}
          fetch-depth: 0
      - name: Read version from gradle.properties
        id: version
        run: |
          V=$(grep -E '^editotsu\.version=' gradle.properties | head -1 | cut -d= -f2 | tr -d '[:space:]')
          OUT=$(python3 - "$V" <<'EOF'
          import re, sys
          v = sys.argv[1]
          m = re.fullmatch(r'(\d+)\.(\d+)\.(\d+)(?:-(alpha|beta|rc)(\d{2}))?', v)
          if not m:
              sys.exit("editotsu.version '%s' is not MAJOR.MINOR.PATCH[-alphaNN|-betaNN|-rcNN]" % v)
          major, minor, patch, stage, nn = m.groups()
          n = int(nn or 0)
          s = {'alpha': n, 'beta': 20 + n, 'rc': 50 + n}.get(stage, 99)
          code = 1_000_000 + int(major) * 10_000_000 + int(minor) * 100_000 + int(patch) * 1_000 + s
          pre = stage is not None
          print("version=%s" % v)
          print("code=%d" % code)
          print("prerelease=%s" % ("true" if pre else "false"))
          print("build_type=%s" % ("beta" if pre else "release"))
          print("package=%s" % ("ani.editotsu.beta" if pre else "ani.editotsu"))
          print("channel=%s" % (stage or "stable"))
          EOF
          ) || { echo "::error::bad editotsu.version"; exit 1; }
          echo "$OUT" | tee -a "$GITHUB_OUTPUT"
          NOTES=".github/release-notes/v$V.md"
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            [ "$GITHUB_REF_NAME" = "v$V" ] || { echo "::error::tag $GITHUB_REF_NAME != v$V"; exit 1; }
            # checked here so a missing file fails before anything is built
            [ -f "$NOTES" ] || { echo "::error::$NOTES missing"; exit 1; }
          else
            [ -f "$NOTES" ] || echo "::warning::$NOTES missing; the tag build will fail without it"
          fi
      - name: Assert exact candidate and record provenance
        env:
          WANT: ${{ steps.resolve.outputs.checked_sha }}
          MODE: ${{ steps.resolve.outputs.trigger_mode }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p evidence-sha

          HEAD_SHA=$(git rev-parse HEAD)

          [ "$HEAD_SHA" = "$WANT" ] || {
            echo "::error::HEAD $HEAD_SHA != candidate $WANT"
            exit 1
          }

          # The candidate must be on main or on a release/X.Y branch (patch releases
          # for the current stable are cut there).
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/release/*:refs/remotes/origin/release/*'
          MAIN_SHA=$(git rev-parse origin/main)
          ON_BRANCH=""
          for B in $(git for-each-ref --format='%(refname:short)' refs/remotes/origin/main 'refs/remotes/origin/release/*'); do
            if git merge-base --is-ancestor "$WANT" "$B"; then ON_BRANCH="$B"; break; fi
          done
          [ -n "$ON_BRANCH" ] || {
            echo "::error::candidate $WANT is not on origin/main or any origin/release/*"
            exit 1
          }
          echo "candidate reachable from $ON_BRANCH"

          if [ "$MODE" = "tag" ]; then
            TAG_SHA=$(git rev-list -n 1 "$REF_NAME")

            [ "$TAG_SHA" = "$WANT" ] || {
              echo "::error::tag $TAG_SHA != approved $WANT"
              exit 1
            }
          fi

          {
            echo "mode=$MODE"
            echo "sha=$HEAD_SHA"
            echo "tree=$(git rev-parse HEAD^{tree})"
            echo "main=$MAIN_SHA"
            echo "branch=$ON_BRANCH"
            echo "run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "ref=${{ github.ref }}"
          } > evidence-sha/candidate.txt

          if git status --short | grep -v '^??' | grep -q .; then
            echo "::error::tracked tree not clean"
            git status --short
            exit 1
          fi

          cat evidence-sha/candidate.txt
      - name: Upload SHA evidence
        uses: actions/upload-artifact@v4
        with:
          name: evidence-sha
          retention-days: 30
          path: evidence-sha/

  tests:
    runs-on: ubuntu-latest
    needs: [sha-gate]
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.sha-gate.outputs.checked_sha }}
          fetch-depth: 0
      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: v1-${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            v1-${{ runner.os }}-gradle-
      - name: Unit tests (google + fdroid)
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testGoogleDebugUnitTest :app:testFdroidDebugUnitTest
      - name: Test summary evidence
        if: always()
        run: |
          mkdir -p evidence-tests
          python3 - <<'EOF' > evidence-tests/test-summary.txt
          import glob, xml.etree.ElementTree as ET
          for flavor in ['testGoogleDebugUnitTest', 'testFdroidDebugUnitTest']:
              t = f = e = s = 0; n = 0
              for path in glob.glob('app/build/test-results/%s/*.xml' % flavor):
                  r = ET.parse(path).getroot(); n += 1
                  t += int(r.get('tests')); f += int(r.get('failures'))
                  e += int(r.get('errors')); s += int(r.get('skipped'))
              print('%s classes=%d tests=%d failures=%d errors=%d skipped=%d' % (flavor, n, t, f, e, s))
          EOF
          cat evidence-tests/test-summary.txt
      - name: Upload test reports + summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-tests
          retention-days: 30
          path: |
            evidence-tests/
            app/build/test-results/testGoogleDebugUnitTest/*.xml
            app/build/test-results/testFdroidDebugUnitTest/*.xml

  version-gate:
    runs-on: ubuntu-latest
    needs: [sha-gate]
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.sha-gate.outputs.checked_sha }}
          fetch-depth: 0
      - name: Assert source version identity
        env:
          EXPECTED_VERSION: ${{ needs.sha-gate.outputs.version }}
          EXPECTED_CODE: ${{ needs.sha-gate.outputs.code }}
        run: |
          mkdir -p evidence-version
          # the version has one home; the build script must still read it from there
          grep -q 'providers.gradleProperty("editotsu.version")' app/build.gradle.kts \
            || { echo "::error::app/build.gradle.kts no longer reads editotsu.version"; exit 1; }
          if grep -E -q '^\s*version(Name|Code) = ("|[0-9])' app/build.gradle.kts; then
            echo "::error::hard-coded versionName/versionCode in app/build.gradle.kts"; exit 1
          fi
          {
            echo "editotsu.version=$EXPECTED_VERSION"
            echo "versionCode=$EXPECTED_CODE"
            echo "channel=${{ needs.sha-gate.outputs.channel }} package=${{ needs.sha-gate.outputs.package }}"
          } | tee evidence-version/version-gate.txt
      - name: Upload version evidence
        uses: actions/upload-artifact@v4
        with:
          name: evidence-version
          retention-days: 30
          path: evidence-version/

  signing-gate:
    runs-on: ubuntu-latest
    needs: [sha-gate]
    steps:
      - name: Require release-signing material (fail closed)
        env:
          KS_FILE: ${{ secrets.KEYSTORE_FILE }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          PINNED_DIGEST: ${{ secrets.EXPECTED_CERT_DIGEST }}
        run: |
          mkdir -p evidence-signing
          missing=""
          [ -z "$KS_FILE" ]       && missing="$missing KEYSTORE_FILE"
          [ -z "$KS_PASS" ]       && missing="$missing KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ]     && missing="$missing KEY_ALIAS"
          [ -z "$KEY_PASS" ]      && missing="$missing KEY_PASSWORD"
          [ -z "$PINNED_DIGEST" ] && missing="$missing EXPECTED_CERT_DIGEST"
          if [ -n "$missing" ]; then
            echo "::error::Release signing secrets missing:$missing — refusing."
            exit 1
          fi
          echo "all release-signing inputs present (values not printed)" | tee evidence-signing/signing-verification.txt
      - name: Upload signing evidence
        uses: actions/upload-artifact@v4
        with:
          name: evidence-signing
          retention-days: 30
          path: evidence-signing/

  mal-gate:
    runs-on: ubuntu-latest
    needs: [sha-gate]
    steps:
      - name: Require MAL client ID (fail closed, length-only proof)
        env:
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
        run: |
          mkdir -p evidence-mal
          if [ -z "$MAL_CLIENT_ID" ]; then
            echo "::error::MAL_CLIENT_ID secret missing/blank — refusing." >&2
            exit 1
          fi
          echo "MAL_CLIENT_ID present, length=${#MAL_CLIENT_ID} (value not printed)" | tee evidence-mal/mal-verification.txt
      - name: Upload MAL evidence
        uses: actions/upload-artifact@v4
        with:
          name: evidence-mal
          retention-days: 30
          path: evidence-mal/

  mal-control:
    runs-on: ubuntu-latest
    needs: [sha-gate, mal-gate]
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.sha-gate.outputs.checked_sha }}
          fetch-depth: 0
      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: v1-${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            v1-${{ runner.os }}-gradle-
      - name: No-credential control build + DEX absence proof
        env:
          MAL_CLIENT_ID: ""
          CONTROL_ID: ${{ secrets.MAL_CLIENT_ID }}
        run: |
          set +x
          mkdir -p evidence-mal-control
          test ! -f ~/.editotsu/credentials/mal.properties || {
            echo "::error::local credential file present; control not blank"
            exit 1
          }
          chmod +x ./gradlew
          # Explicitly non-publishable dev signing route (never a release signer).
          ./gradlew -Peditotsu.devSigning=debug :app:assembleGoogleDebug

          APK=$(ls -t app/build/outputs/apk/google/debug/app-google-*-debug.apk | head -1)

          echo "control APK (NON-RELEASE evidence only, never published): $APK" \
            | tee evidence-mal-control/mal-control.txt

          COUNT=$(
            unzip -p "$APK" 'classes*.dex' |
            CONTROL_NEEDLE="$CONTROL_ID" python3 -c \
              "import os,sys; print(sys.stdin.buffer.read().count(os.environ['CONTROL_NEEDLE'].encode()))"
          )

          echo "control DEX-byte count: $COUNT" \
            | tee -a evidence-mal-control/mal-control.txt

          echo "non-release evidence only" \
            | tee -a evidence-mal-control/mal-control.txt
      - name: Assert absence separately (count must be exactly 0)
        run: |
          grep -q "control DEX-byte count: 0" evidence-mal-control/mal-control.txt || { echo "::error::control shows unexpected credential presence"; exit 1; }
      - name: Upload control evidence (no APK binary)
        uses: actions/upload-artifact@v4
        with:
          name: evidence-mal-control
          retention-days: 30
          path: evidence-mal-control/

  build:
    runs-on: ubuntu-latest
    needs: [sha-gate, tests, version-gate, signing-gate, mal-gate]
    strategy:
      fail-fast: true
      matrix:
        flavor: [google, fdroid]
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.sha-gate.outputs.checked_sha }}
          fetch-depth: 0
      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: v1-${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            v1-${{ runner.os }}-gradle-
      - name: Decode keystore (CP4-A contract mapping)
        env:
          KS_FILE_B64: ${{ secrets.KEYSTORE_FILE }}
        run: printf '%s' "$KS_FILE_B64" | base64 -d > "$GITHUB_WORKSPACE/key.keystore"
      - name: Build release flavor (this flavor only)
        env:
          EDITOTSU_STORE_FILE: ${{ github.workspace }}/key.keystore
          EDITOTSU_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          EDITOTSU_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          EDITOTSU_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
          BUILD_TYPE: ${{ needs.sha-gate.outputs.build_type }}
          FLAVOR: ${{ matrix.flavor }}
        run: |
          chmod +x ./gradlew
          TASK="assemble${FLAVOR^}${BUILD_TYPE^}"
          echo "gradle task: $TASK"
          ./gradlew "$TASK"
      - name: Upload this flavor's APKs only
        uses: actions/upload-artifact@v4
        with:
          name: apks-${{ matrix.flavor }}
          retention-days: 14
          path: app/build/outputs/apk/${{ matrix.flavor }}/${{ needs.sha-gate.outputs.build_type }}/*.apk

  verify:
    runs-on: ubuntu-latest
    needs: [sha-gate, build, mal-control]
    env:
      EXPECTED_VERSION: ${{ needs.sha-gate.outputs.version }}
      EXPECTED_CODE: ${{ needs.sha-gate.outputs.code }}
      EXPECTED_PKG: ${{ needs.sha-gate.outputs.package }}
      BUILD_TYPE: ${{ needs.sha-gate.outputs.build_type }}
    steps:
      - name: Download built APKs
        uses: actions/download-artifact@v4
        with:
          pattern: apks-*
          merge-multiple: true
          path: release-apks
      - name: Download gate evidence
        uses: actions/download-artifact@v4
        with:
          pattern: evidence-*
          merge-multiple: false
          path: gate-evidence
      - name: APK identity + signer + MAL DEX-byte proof
        env:
          PINNED_DIGEST: ${{ secrets.EXPECTED_CERT_DIGEST }}
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
        run: |
          set +x
          mkdir -p release-evidence
          TOOLS="$ANDROID_HOME/build-tools"
          APKSIGNER=$(ls "$TOOLS"/*/apksigner 2>/dev/null | sort -V | tail -1)
          AAPT2=$(ls "$TOOLS"/*/aapt2 2>/dev/null | sort -V | tail -1)
          [ -n "$APKSIGNER" ] || { echo "::error::apksigner not found under $TOOLS"; exit 1; }
          [ -n "$AAPT2" ] || { echo "::error::aapt2 not found under $TOOLS"; exit 1; }
          echo "apksigner=$APKSIGNER" | tee release-evidence/tooling.txt
          echo "aapt2=$AAPT2" | tee -a release-evidence/tooling.txt
          EXPECTED=$(printf '%s' "$PINNED_DIGEST" | tr -d ':' | tr 'A-Z' 'a-z')
          echo "expected package for $EXPECTED_VERSION: $EXPECTED_PKG"
          rc=0
          : > release-evidence/apk-badging.txt
          : > release-evidence/apk-signers.txt
          : > release-evidence/mal-dex-counts.txt
          for APK in release-apks/*.apk; do
            echo "== $APK ==" | tee -a release-evidence/apk-badging.txt
            BADGING=$("$AAPT2" dump badging "$APK" | head -1)
            echo "$BADGING" | tee -a release-evidence/apk-badging.txt
            echo "$BADGING" | grep -q "name='$EXPECTED_PKG'" || { echo "::error::package mismatch"; rc=1; }
            echo "$BADGING" | grep -q "versionCode='$EXPECTED_CODE'" || { echo "::error::versionCode mismatch"; rc=1; }
            echo "$BADGING" | grep -q "versionName='$EXPECTED_VERSION'" || { echo "::error::versionName mismatch"; rc=1; }
            CERTS=$("$APKSIGNER" verify --print-certs "$APK") || { echo "::error::not properly signed"; rc=1; continue; }
            echo "$CERTS" >> release-evidence/apk-signers.txt
            echo "$CERTS" | grep -q "CN=Android Debug" && { echo "::error::debug signer"; rc=1; continue; }
            ACTUAL=$(echo "$CERTS" | grep -oP 'SHA-256 digest:? \K[0-9a-fA-F]+' | head -1 | tr -d ':' | tr 'A-Z' 'a-z')
            [ "$ACTUAL" = "$EXPECTED" ] || { echo "::error::cert digest mismatch"; rc=1; }
            COUNT=$(unzip -p "$APK" 'classes*.dex' | MAL_NEEDLE="$MAL_CLIENT_ID" python3 -c "import os,sys; print(sys.stdin.buffer.read().count(os.environ['MAL_NEEDLE'].encode()))")
            echo "$(basename "$APK"): MAL DEX-byte count=$COUNT" | tee -a release-evidence/mal-dex-counts.txt
            [ "$COUNT" -gt 0 ] || { echo "::error::MAL client ID absent from DEX"; rc=1; }
          done
          exit $rc
      - name: Rename assets + SHA256SUMS + asset list
        run: |
          mkdir -p final
          for f in google fdroid; do
            for abi in arm64-v8a universal; do
              SRC="release-apks/app-$f-$abi-$BUILD_TYPE.apk"
              [ -f "$SRC" ] || { echo "::error::missing $SRC"; exit 1; }
              cp "$SRC" "final/Editotsu-$EXPECTED_VERSION-$f-$abi.apk"
            done
          done
          (cd final && sha256sum Editotsu-*.apk > SHA256SUMS && cat SHA256SUMS)
          ls -1 final/ | tee release-evidence/asset-list.txt
      - name: Upload evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          retention-days: 30
          path: |
            final/
            release-evidence/
            gate-evidence/

  release:
    runs-on: ubuntu-latest
    needs: [sha-gate, verify]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    env:
      V: ${{ needs.sha-gate.outputs.version }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Gate on approved RC SHA (fail closed, defense in depth)
        env:
          VAR: ${{ vars.APPROVED_RELEASE_SHA }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$VAR" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::APPROVED_RELEASE_SHA missing or not 40-hex"; exit 1
          fi
          [ -f ".github/release-notes/v$V.md" ] || { echo "::error::.github/release-notes/v$V.md missing"; exit 1; }
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/release/*:refs/remotes/origin/release/*'
          TAG_SHA=$(git rev-list -n 1 "$REF_NAME")
          [ "$TAG_SHA" = "$VAR" ] || { echo "::error::tag $TAG_SHA != approved $VAR"; exit 1; }
          ON_BRANCH=""
          for B in $(git for-each-ref --format='%(refname:short)' refs/remotes/origin/main 'refs/remotes/origin/release/*'); do
            if git merge-base --is-ancestor "$TAG_SHA" "$B"; then ON_BRANCH="$B"; break; fi
          done
          [ -n "$ON_BRANCH" ] || { echo "::error::tag $TAG_SHA is not on origin/main or any origin/release/*"; exit 1; }
          echo "tag matches the approved SHA and is on $ON_BRANCH"
      - name: Download evidence bundle
        uses: actions/download-artifact@v4
        with:
          name: release-evidence
          path: evidence
      - name: Create GitHub pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Editotsu v${{ needs.sha-gate.outputs.version }}${{ needs.sha-gate.outputs.prerelease == 'true' && format(' ({0})', needs.sha-gate.outputs.channel) || '' }}
          body_path: .github/release-notes/v${{ needs.sha-gate.outputs.version }}.md
          prerelease: ${{ needs.sha-gate.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.sha-gate.outputs.prerelease == 'true' && 'false' || 'true' }}
          draft: false
          fail_on_unmatched_files: true
          files: |
            evidence/final/Editotsu-${{ needs.sha-gate.outputs.version }}-google-arm64-v8a.apk
            evidence/final/Editotsu-${{ needs.sha-gate.outputs.version }}-google-universal.apk
            evidence/final/Editotsu-${{ needs.sha-gate.outputs.version }}-fdroid-arm64-v8a.apk
            evidence/final/Editotsu-${{ needs.sha-gate.outputs.version }}-fdroid-universal.apk
            evidence/final/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
